<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="strict-origin-when-cross-origin">
<title>Glyph &middot; now playing</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden;
    font: 11px/16px ui-monospace, "SF Mono", Menlo, Consolas, "DejaVu Sans Mono", monospace; color: #bbb; }
  body { box-sizing: border-box; border: 1px solid rgba(255,255,255,.12); }
  #bar { position: fixed; top: 1px; left: 1px; right: 1px; height: 16px; display: flex; justify-content: space-between;
    background: #050505; border-bottom: 1px solid rgba(255,255,255,.12); user-select: none; letter-spacing: .06em; z-index: 3; }
  #label { flex: 1; padding: 0 6px; cursor: move; white-space: nowrap; overflow: hidden; color: #ddd; }
  #x { width: 22px; text-align: center; cursor: pointer; color: #999; }
  #x:hover { color: #f55; }
  #stage { position: fixed; top: 18px; left: 1px; right: 1px; bottom: 1px; background: transparent; z-index: 1; }
  #stage iframe, #stage > div { width: 100%; height: 100%; border: 0; display: block; }
  #msg { position: fixed; top: 18px; bottom: 1px; left: 1px; right: 1px; display: flex; align-items: center;
    justify-content: center; color: #888; z-index: 0; pointer-events: none; font-size: 18px; }
</style>
</head>
<body>
<div id="bar"><div id="label">[ NOW PLAYING ]</div><div id="x" title="close">&times;</div></div>
<div id="stage"></div>
<div id="msg">|</div>
<script>
(function () {
  "use strict";
  var hasIpc = !!(window.ipc && window.ipc.postMessage);
  var token = location.pathname.split("/")[1] || "";
  var session = 0, provider = null, adapter = null, volume = 100, wantPlay = true;
  var $stage = document.getElementById("stage"), $msg = document.getElementById("msg");

  function post(o) {
    o.s = session;
    var j = JSON.stringify(o);
    if (hasIpc) { window.ipc.postMessage(j); return; }
    try { fetch("/" + token + "/event", { method: "POST", body: j, keepalive: true }).catch(function () {}); } catch (e) {}
  }
  function raw(s) { if (hasIpc) window.ipc.postMessage(s); }
  function err(m) { post({ t: "error", msg: String(m) }); $msg.textContent = "ERR " + m; $msg.style.display = "flex"; }
  function state(v) { post({ t: "state", v: v }); if (v === "playing") $msg.style.display = "none"; }

  var scripts = {};
  function loadScript(src, cb) {
    if (scripts[src]) { scripts[src].push(cb); if (scripts[src].done) cb(); return; }
    var list = scripts[src] = [cb];
    var s = document.createElement("script");
    s.src = src;
    s.onload = function () { list.done = true; list.forEach(function (f) { f(); }); };
    s.onerror = function () { err("cannot load " + src); };
    document.head.appendChild(s);
  }

  // ---------------------------------------------------------------- YouTube
  var YT_STATES = { "-1": "unstarted", "0": "ended", "1": "playing", "2": "paused", "3": "buffering", "5": "cued" };
  var YT_ERRORS = { 2: "invalid video id", 5: "html5 player error", 100: "video not found or private",
    101: "embedding disabled by owner", 150: "embedding disabled by owner", 153: "embed origin rejected" };
  function youtube() {
    var p = null, ready = false, pending = null;
    function create(id, autoplay) {
      $stage.innerHTML = '<div id="yt"></div>';
      p = new YT.Player("yt", {
        width: "100%", height: "100%", videoId: id,
        playerVars: { autoplay: autoplay ? 1 : 0, playsinline: 1, rel: 0, enablejsapi: 1,
          origin: location.origin, controls: 1, modestbranding: 1 },
        events: {
          onReady: function () { ready = true; try { p.setVolume(volume); } catch (e) {} post({ t: "ready" }); },
          onStateChange: function (e) { var v = YT_STATES[String(e.data)]; if (v) state(v); },
          onError: function (e) { err("YouTube " + e.data + ": " + (YT_ERRORS[e.data] || "error")); }
        }
      });
    }
    return {
      load: function (id, autoplay) {
        loadScript("https://www.youtube.com/iframe_api", function () {
          var go = function () {
            if (p && ready) { autoplay ? p.loadVideoById(id) : p.cueVideoById(id); }
            else create(id, autoplay);
          };
          if (window.YT && YT.Player) go(); else window.onYouTubeIframeAPIReady = go;
        });
      },
      play: function () { if (ready) p.playVideo(); },
      pause: function () { if (ready) p.pauseVideo(); },
      seek: function (s) { if (ready) p.seekTo(s, true); },
      volume: function (v) { if (ready) p.setVolume(v); },
      time: function () {
        if (!ready || !p.getCurrentTime) return;
        post({ t: "time", pos: p.getCurrentTime() || 0, dur: p.getDuration() || 0 });
      }
    };
  }

  // ---------------------------------------------------------------- SoundCloud
  function soundcloud() {
    var w = null, ready = false, pos = 0, dur = 0;
    function src(url, autoplay) {
      return "https://w.soundcloud.com/player/?url=" + encodeURIComponent(url) +
        "&auto_play=" + (autoplay ? "true" : "false") + "&visual=false&show_comments=false&hide_related=true&show_teaser=false";
    }
    function bind() {
      var E = SC.Widget.Events;
      w.bind(E.READY, function () { ready = true; w.setVolume(volume); post({ t: "ready" }); });
      w.bind(E.PLAY, function () { state("playing"); });
      w.bind(E.PAUSE, function () { state("paused"); });
      w.bind(E.FINISH, function () { state("ended"); });
      w.bind(E.ERROR, function () { err("SoundCloud playback error"); });
    }
    return {
      load: function (url, autoplay) {
        loadScript("https://w.soundcloud.com/player/api.js", function () {
          if (w && ready) { ready = false; w.load(url, { auto_play: autoplay, callback: function () { ready = true; w.setVolume(volume); } }); return; }
          $stage.innerHTML = '<iframe id="sc" allow="autoplay" src="' + src(url, autoplay) + '"></iframe>';
          w = SC.Widget(document.getElementById("sc"));
          bind();
        });
      },
      play: function () { if (w) w.play(); },
      pause: function () { if (w) w.pause(); },
      seek: function (s) { if (w) w.seekTo(s * 1000); },
      volume: function (v) { if (w) w.setVolume(v); },
      time: function () {
        if (!w || !ready) return;
        w.getPosition(function (p) { pos = p / 1000; w.getDuration(function (d) { dur = d / 1000; post({ t: "time", pos: pos, dur: dur }); }); });
      }
    };
  }

  var adapters = { youtube: null, soundcloud: null };

  window.glyph = {
    setLabel: function (t) { document.getElementById("label").textContent = t; },
    load: function (prov, id, autoplay, vol, sess) {
      session = sess; volume = vol; wantPlay = autoplay;
      $msg.textContent = "|"; $msg.style.display = "flex";
      if (provider !== prov) { $stage.innerHTML = ""; adapters[prov] = null; }
      provider = prov;
      if (!adapters[prov]) adapters[prov] = prov === "youtube" ? youtube() : soundcloud();
      adapter = adapters[prov];
      adapter.load(id, autoplay);
    },
    play: function () { if (adapter) adapter.play(); },
    pause: function () { if (adapter) adapter.pause(); },
    seek: function (s) { if (adapter) adapter.seek(s); },
    volume: function (v) { volume = v; if (adapter) adapter.volume(v); }
  };

  // ASCII spinner while nothing plays.
  var spin = "|/-\\", si = 0;
  setInterval(function () { if ($msg.style.display !== "none" && $msg.textContent.length === 1) $msg.textContent = spin[si++ % 4]; }, 120);

  // current time every 250 ms
  setInterval(function () { if (adapter) { try { adapter.time(); } catch (e) {} } }, 250);

  // window chrome (frameless webview)
  document.getElementById("label").addEventListener("mousedown", function (e) { if (e.button === 0) raw("drag"); });
  document.getElementById("x").addEventListener("click", function () {
    if (adapter) adapter.pause();
    if (hasIpc) raw("close"); else post({ t: "closed" });
  });

  // browser transport: long-poll for scripts to run
  if (!hasIpc) {
    (function poll() {
      fetch("/" + token + "/poll").then(function (r) { return r.json(); }).then(function (list) {
        list.forEach(function (js) { try { (0, eval)(js); } catch (e) { err(e); } });
        poll();
      }).catch(function () { setTimeout(poll, 1000); });
    })();
  }

  post({ t: "page" });
})();
</script>
</body>
</html>
