[package]
name = "glyph-audio"
description = "Glyph playback: native decode (rodio/symphonia) + visible embed mini-player (wry), FFT, media keys."
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
glyph-protocol.workspace = true
anyhow.workspace = true
thiserror.workspace = true
tracing.workspace = true
flume.workspace = true
serde_json.workspace = true
sha2 = "0.10"
reqwest = { workspace = true, features = ["blocking"] }
rodio = { version = "0.23", default-features = false, features = ["playback"] }
symphonia = { version = "0.5", default-features = false, features = ["mp3", "aac", "isomp4", "flac", "ogg", "vorbis", "wav", "pcm", "alac", "adpcm", "mkv"] }
rustfft = "6"
souvlaki = { version = "0.8", default-features = false, features = ["use_zbus"] }
webbrowser = "1"

raw-window-handle = "0.6"
wry = "0.57"

# CPAL only registers its WASAPI callback with Windows MMCSS when enabled.
# Keep audio scheduled ahead of ordinary UI/background work when minimized.
[target.'cfg(target_os = "windows")'.dependencies]
cpal = { version = "0.18", features = ["realtime"] }

# Own-window mini-player (fallback) runs tao on its own thread where the OS allows it.
[target.'cfg(any(target_os = "windows", target_os = "linux"))'.dependencies]
tao = "0.37"

# wry's webkit2gtk needs gtk initialised/pumped by us for the child-webview host.
[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18"

[features]
# The Windows embed-host check needs tao, which is not a dependency on macOS;
# build it with `--features embed-host-example`.
embed-host-example = []

[[example]]
name = "embed_host_win"
required-features = ["embed-host-example"]
