[package]
name = "glyph-audio"
description = "Glyph playback: native decode (rodio/symphonia) + visible embed mini-player (wry), FFT, media keys."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
glyph-protocol.workspace = true
anyhow.workspace = true
thiserror.workspace = true
tracing.workspace = true
flume.workspace = true
serde_json.workspace = true
sha2 = "0.11"
reqwest = { workspace = true, features = ["blocking"] }
rodio = { version = "0.23", default-features = false, features = ["playback"] }
symphonia = { version = "0.5", default-features = false, features = ["mp3", "aac", "isomp4", "flac", "ogg", "vorbis", "wav", "pcm", "alac", "adpcm", "mkv"] }
rustfft = "6"
webbrowser = "1"

raw-window-handle = "0.6"

# Desktop only: OS media keys. Phones get them from their app shell (see media_keys_hosted.rs).
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
souvlaki = { version = "0.8", default-features = false, features = ["use_zbus"] }

# Child webview for the embed player (Windows WebView2, macOS WKWebView).
# `default-features = false` omits wry's optional Linux gtk3/webkit2gtk/glib stack.
[target.'cfg(any(target_os = "windows", target_os = "macos"))'.dependencies]
wry = { version = "0.57", default-features = false }

# CPAL only registers its WASAPI callback with Windows MMCSS when enabled.
# Keep audio scheduled ahead of ordinary UI/background work when minimized.
[target.'cfg(target_os = "windows")'.dependencies]
cpal = { version = "0.18", features = ["realtime"] }
windows = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_Com",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }
webview2-com = "0.39"

[features]
# Build the Windows embed-host check with `--features embed-host-example`.
embed-host-example = []

[[example]]
name = "embed_host_win"
required-features = ["embed-host-example"]
