[package]
name = "glyph-core"
description = "GPUI-free core of Glyph: providers, resolver, server client, library, lyrics, import, updater."
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
glyph-protocol.workspace = true
serde.workspace = true
serde_json.workspace = true
anyhow.workspace = true
thiserror.workspace = true
tracing.workspace = true
tokio = { workspace = true, features = ["process"] }
futures.workspace = true
reqwest.workspace = true
async-trait = "0.1"
toml = "0.8"
dirs = "6"
lru = "0.12"
sha2 = "0.10"
tempfile = "3"
semver = "1"
sys-locale = "0.3"
uuid = { version = "1", features = ["v4"] }
rand = "0.8"
# Tags + embedded covers of imported audio files (same build as glyph-audio).
symphonia = { version = "0.5", default-features = false, features = ["mp3", "aac", "isomp4", "flac", "ogg", "vorbis", "wav", "pcm", "alac", "adpcm", "mkv"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
webp = { version = "0.3.1", default-features = false }
self-replace = "1"
zip = { version = "9", default-features = false, features = ["deflate"] }
flate2 = "1"
base64 = "0.22"
tar = "0.4"
# Password key derivation on the device (see glyph_protocol::password_kdf).
argon2 = { version = "0.5", default-features = false, features = ["alloc"] }
chacha20poly1305 = "0.10"

# Account refresh token in the OS keychain (same backends as glyph-server).
[target.'cfg(windows)'.dependencies]
keyring = { version = "3", features = ["windows-native"] }

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3", features = ["apple-native"] }

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3", features = ["async-secret-service", "tokio", "crypto-rust"] }
