[package]
name = "glyph-android"
description = "Android shell: runs the Glyph core/audio backend inside an AppCompat WebView shell."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lib]
# Loaded by MainActivity / PlaybackService via System.loadLibrary("glyph_android").
name = "glyph_android"
crate-type = ["cdylib"]

[target.'cfg(target_os = "android")'.dependencies]
glyph-app.workspace = true
glyph-protocol.workspace = true
glyph-core.workspace = true
glyph-audio.workspace = true
serde.workspace = true
serde_json.workspace = true
anyhow.workspace = true
tokio.workspace = true
futures.workspace = true
flume.workspace = true
reqwest.workspace = true
jni = "0.22"
ndk-context = "0.1"
log = "0.4"
android_logger = "0.15"
# Without a subscriber, tracing events go to `log` and so to logcat.
tracing = { workspace = true, features = ["log"] }
