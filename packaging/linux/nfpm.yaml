# .deb and .rpm for the release (see .github/workflows/release.yml):
#   VERSION=0.6.1 NFPM_ARCH=amd64 BINARY=target/.../glyph nfpm pkg -f packaging/linux/nfpm.yaml -p deb
# Installs system-wide, so Glyph shows up in the app launcher and is removed
# with the package manager like any other app.
name: glyph
arch: ${NFPM_ARCH}
platform: linux
version: ${VERSION}
section: sound
priority: optional
maintainer: glyphmusic <https://glyph.my>
vendor: glyphmusic
homepage: https://glyph.my
license: MIT OR Apache-2.0
description: Native music app - search everywhere, play only from legal free sources.

contents:
  - src: ${BINARY}
    dst: /usr/bin/glyph
    file_info:
      mode: 0755
  - src: packaging/linux/glyph.desktop
    dst: /usr/share/applications/glyph.desktop
  - src: assets/icons/icon-16.png
    dst: /usr/share/icons/hicolor/16x16/apps/glyph.png
  - src: assets/icons/icon-32.png
    dst: /usr/share/icons/hicolor/32x32/apps/glyph.png
  - src: assets/icons/icon-48.png
    dst: /usr/share/icons/hicolor/48x48/apps/glyph.png
  - src: assets/icons/icon-64.png
    dst: /usr/share/icons/hicolor/64x64/apps/glyph.png
  - src: assets/icons/icon-128.png
    dst: /usr/share/icons/hicolor/128x128/apps/glyph.png
  - src: assets/icons/icon-256.png
    dst: /usr/share/icons/hicolor/256x256/apps/glyph.png
  - src: assets/icons/icon-512.png
    dst: /usr/share/icons/hicolor/512x512/apps/glyph.png
  # Tells the updater this came from a GitHub release, not a distro
  # repository (glyph_core::updater::is_release_package).
  - src: packaging/linux/release-package
    dst: /usr/share/glyph/release-package
  - src: LICENSE-MIT
    dst: /usr/share/doc/glyph/LICENSE-MIT
  - src: LICENSE-APACHE
    dst: /usr/share/doc/glyph/LICENSE-APACHE

overrides:
  deb:
    depends:
      - libxkbcommon0
      - libxkbcommon-x11-0
      - libwayland-client0
      - libvulkan1
      - libasound2 | libasound2t64
      - libfontconfig1
      - libfreetype6
      - libdbus-1-3
      - libssl3 | libssl3t64
      - libgtk-3-0 | libgtk-3-0t64
      - libwebkit2gtk-4.1-0
  rpm:
    depends:
      - libxkbcommon
      - libxkbcommon-x11
      - libwayland-client
      - vulkan-loader
      - alsa-lib
      - fontconfig
      - freetype
      - dbus-libs
      - openssl-libs
      - gtk3
      - webkit2gtk4.1
