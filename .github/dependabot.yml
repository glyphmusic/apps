version: 2
updates:
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      cargo-dependencies:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "gradle"
    directory: "/mobile/android"
    schedule:
      interval: "weekly"
    ignore:
      # Must match android-activity's GameActivity glue in Cargo.toml.
      - dependency-name: "androidx.games:games-activity"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
