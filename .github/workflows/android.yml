# Android APK for a release tag: built, signed with the Glyph release key
# (secrets ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD) and attached
# as an artifact. Only release.yml publishes the complete signed release.
# With warm_cache (release-cache.yml, on main) it only compiles the Rust
# libraries and saves their cache: caches saved by a tag run are invisible
# to the next tag, so release runs restore the one saved on main.
name: Android

on:
  workflow_call:
    inputs:
      tag: { type: string, required: false, default: "" }
      warm_cache: { type: boolean, required: false, default: false }
  workflow_dispatch:
    inputs:
      tag: { description: "Release tag, e.g. v0.5.0", type: string, required: true }

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,x86_64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: release-android
          save-if: ${{ inputs.warm_cache == true }}
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      # The runner image ships the SDK; setup-android trips over preview licenses.
      - name: NDK and cargo-ndk
        run: |
          SDKMANAGER=$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | sort -V | tail -1)
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" --install "platforms;android-36" "build-tools;36.0.0" > /dev/null
          # NDK: the runner image ships recent ones, so use 28.2 or the newest
          # 27+ already there; download only when none is, with retries (the
          # NDK download kept failing with a broken zip on 2026-11-19).
          NDK=""
          for d in "$ANDROID_HOME/ndk/28.2.13676358" $(ls -d "$ANDROID_HOME"/ndk/2[7-9].* 2>/dev/null | sort -rV); do
            if [ -f "$d/source.properties" ]; then NDK="$d"; break; fi
          done
          if [ -z "$NDK" ]; then
            for i in 1 2 3; do
              "$SDKMANAGER" --install "ndk;28.2.13676358" > /dev/null && break
              rm -rf "$ANDROID_HOME/ndk/28.2.13676358"; sleep 15
            done
            NDK="$ANDROID_HOME/ndk/28.2.13676358"
          fi
          test -f "$NDK/source.properties"
          echo "Using NDK $NDK"
          echo "ANDROID_NDK_HOME=$NDK" >> "$GITHUB_ENV"
          cargo install cargo-ndk --locked
      - name: Build Rust libraries
        run: cargo ndk -t arm64-v8a -t x86_64 -P 26 -o mobile/android/app/src/main/jniLibs build -p glyph-android --release
      - uses: actions/setup-node@v7
        if: ${{ !inputs.warm_cache }}
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: glyph-ui/package-lock.json
      - name: Build UI
        if: ${{ !inputs.warm_cache }}
        run: |
          npm --prefix glyph-ui ci
          npm --prefix glyph-ui run build
      - name: Build APK
        if: ${{ !inputs.warm_cache }}
        run: |
          cd mobile/android
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease
      - name: Sign
        if: ${{ !inputs.warm_cache }}
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          [ -n "$KEYSTORE_BASE64" ] || { echo "::error::ANDROID_KEYSTORE_BASE64 is not set"; exit 1; }
          VERSION="${{ inputs.tag }}"; VERSION="${VERSION#v}"
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/glyph-release.p12"
          mkdir -p dist
          APK="dist/glyph-$VERSION-android.apk"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" sign --ks "$RUNNER_TEMP/glyph-release.p12" \
            --ks-key-alias glyph-release --ks-pass env:KEYSTORE_PASSWORD --key-pass env:KEYSTORE_PASSWORD \
            --out "$APK" mobile/android/app/build/outputs/apk/release/app-release.apk
          rm "$RUNNER_TEMP/glyph-release.p12"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs "$APK" | grep -i 'SHA-256'
          rm -f dist/*.idsig
          cd dist && sha256sum "glyph-$VERSION-android.apk" > "glyph-$VERSION-android.apk.sha256"
      - uses: actions/upload-artifact@v7
        if: ${{ !inputs.warm_cache }}
        with:
          name: release-android
          path: |
            dist/*.apk
            dist/*.sha256
          if-no-files-found: error
