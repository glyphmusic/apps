# On tag v*: build Glyph for every target and attach archives, installable apps
# (Windows setup, macOS .dmg, Linux .deb/.rpm) + SHA256SUMS.txt to the GitHub
# release. The in-app updater (glyph-core/src/updater.rs) relies on
# the asset names `glyph-{version}-{target}.zip|.tar.gz` and exact manifest filenames.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64-unknown-linux-gnu, ext: tar.gz }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu, ext: tar.gz }
          - { os: macos-15-intel, target: x86_64-apple-darwin, ext: tar.gz }
          - { os: macos-latest, target: aarch64-apple-darwin, ext: tar.gz }
          - { os: windows-latest, target: x86_64-pc-windows-msvc, ext: zip }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: false
      - name: Linux system packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev \
            libvulkan-dev libx11-xcb-dev libxcb1-dev libfontconfig-dev libfreetype-dev \
            libasound2-dev libdbus-1-dev libssl-dev pkg-config \
            libwebkit2gtk-4.1-dev libgtk-3-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev
      - name: Build
        run: cargo build --release -p glyph --target ${{ matrix.target }}
      - name: Package
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          NAME="glyph-${VERSION}-${{ matrix.target }}"
          mkdir -p "dist/$NAME"
          BIN=glyph; [ "${{ runner.os }}" = "Windows" ] && BIN=glyph.exe
          cp "target/${{ matrix.target }}/release/$BIN" "dist/$NAME/"
          cp README.md config.example.toml "dist/$NAME/" 2>/dev/null || true
          cd dist
          if [ "${{ matrix.ext }}" = "zip" ]; then
            7z a "$NAME.zip" "$NAME" > /dev/null
          else
            tar czf "$NAME.tar.gz" "$NAME"
          fi
          ASSET="$NAME.${{ matrix.ext }}"
          if command -v sha256sum >/dev/null; then sha256sum "$ASSET" > "$ASSET.sha256"; else shasum -a 256 "$ASSET" > "$ASSET.sha256"; fi
      - name: Build Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install innosetup --yes --no-progress
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $version = '${{ github.ref_name }}'.TrimStart('v')
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DAppVersion=$version" "/DBinaryPath=$PWD\target\${{ matrix.target }}\release\glyph.exe" packaging/windows/glyph.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $asset = Get-Item "dist/glyph-$version-windows-x64-setup.exe"
          $hash = (Get-FileHash $asset.FullName -Algorithm SHA256).Hash.ToLower()
          [IO.File]::WriteAllText($asset.FullName + '.sha256', "$hash  $($asset.Name)`n")
      - name: Build macOS app
        if: runner.os == 'macOS'
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          ARCH=arm64; [ "${{ matrix.target }}" = x86_64-apple-darwin ] && ARCH=x64
          ASSET="glyph-$VERSION-macos-$ARCH.dmg"
          bash packaging/macos/build-dmg.sh "target/${{ matrix.target }}/release/glyph" "$VERSION" "dist/$ASSET"
          cd dist && shasum -a 256 "$ASSET" > "$ASSET.sha256"
      - name: Build Linux packages
        if: runner.os == 'Linux'
        shell: bash
        run: |
          echo 'deb [trusted=yes] https://repo.goreleaser.com/apt/ /' | sudo tee /etc/apt/sources.list.d/goreleaser.list
          sudo apt-get update
          sudo apt-get install -y nfpm
          export VERSION="${GITHUB_REF_NAME#v}" BINARY="target/${{ matrix.target }}/release/glyph"
          export NFPM_ARCH=amd64; ARCH=x64
          if [ "${{ matrix.target }}" = aarch64-unknown-linux-gnu ]; then NFPM_ARCH=arm64; ARCH=arm64; fi
          for p in deb rpm; do
            ASSET="glyph-$VERSION-linux-$ARCH.$p"
            nfpm pkg -f packaging/linux/nfpm.yaml -p "$p" -t "dist/$ASSET"
            (cd dist && sha256sum "$ASSET" > "$ASSET.sha256")
          done
      - uses: softprops/action-gh-release@v2
        with:
          # v1.2.0-beta.1 & co. are pre-releases: only the pre-release channel sees them.
          draft: true
          body_path: RELEASE_NOTES.md
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: |
            dist/*.zip
            dist/*.tar.gz
            dist/*-setup.exe
            dist/*.dmg
            dist/*.deb
            dist/*.rpm
      - uses: actions/upload-artifact@v4
        with:
          name: checksums-${{ matrix.target }}
          path: dist/*.sha256
          if-no-files-found: error

  android:
    uses: ./.github/workflows/android.yml
    with:
      tag: ${{ github.ref_name }}
    secrets: inherit

  publish:
    needs: [build, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: checksums-*
          merge-multiple: true
          path: checksums
      - name: Combine checksums
        run: cat checksums/*.sha256 | sort > SHA256SUMS.txt
      - name: Publish complete release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          TAG="${{ github.ref_name }}"
          gh release upload "$TAG" SHA256SUMS.txt --clobber
          # A pre-release (tag with `-`, or ticked by hand on GitHub) never becomes "Latest".
          if [ "$(gh release view "$TAG" --json isPrerelease -q .isPrerelease)" = true ]; then
            gh release edit "$TAG" --draft=false --latest=false
          else
            gh release edit "$TAG" --draft=false --latest
          fi
