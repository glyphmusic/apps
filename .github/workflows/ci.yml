name: CI

on:
  push:
    branches: [main]
  pull_request:

# A new push to the same PR/branch cancels the run that is still going.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  # PRs and pushes to main: one cheap Linux run. `cargo check` catches compile
  # errors without producing the app binary; core tests still run. Full app
  # builds only happen for release tags (release.yml).
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Linux system packages (GPUI, webview, audio, media keys)
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev \
            libvulkan-dev libx11-xcb-dev libxcb1-dev libfontconfig-dev libfreetype-dev \
            libasound2-dev libdbus-1-dev libssl-dev pkg-config \
            libwebkit2gtk-4.1-dev libgtk-3-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev
      - name: Test core crates
        run: cargo test -p glyph-protocol -p glyph-core -p glyph-audio
      - name: Check app
        run: cargo check -p glyph
