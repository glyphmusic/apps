[workspace]
resolver = "2"
members = [".", "crates/glyph-protocol", "crates/glyph-core", "crates/glyph-audio", "crates/glyph-gpui-android", "crates/glyph-android"]

[workspace.package]
version = "0.5.0"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/glyphmusic/apps"
rust-version = "1.85"

[workspace.dependencies]
glyph-protocol = { path = "crates/glyph-protocol" }
glyph-core = { path = "crates/glyph-core" }
glyph-audio = { path = "crates/glyph-audio" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
thiserror = "2"
tracing = "0.1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "fs"] }
futures = "0.3"
flume = "0.11"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream", "gzip"] }

# ---- Desktop app (GPUI). Owned by the UI work stream. ----
[package]
name = "glyph"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Native music app: search everywhere, play only from legal free sources."

[dependencies]
serde_json.workspace = true
unicode-segmentation = "1"
glyph-protocol.workspace = true
glyph-core.workspace = true
glyph-audio.workspace = true
# Pinned Zed revision (2026-10-16). Bump deliberately.
gpui = { git = "https://github.com/zed-industries/zed", rev = "9f63850f7affbd57772a4f99554d4fd333b50a6f" }
raw-window-handle = "0.6"
toml = "0.8"
sys-locale = "0.3"
anyhow.workspace = true
tracing.workspace = true
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
futures.workspace = true
flume.workspace = true
noise = "0.9"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
# Network playback devices (src/devices): UPnP description / SOAP XML, the
# Cast TLS channel (ring backend, as reqwest), and relaying streams to
# devices that cannot open HTTPS.
roxmltree = "0.20"
# Jam invite QR code (Connect panel); drawn by the app, no image features.
qrcode = { version = "0.14", default-features = false }
# One search socket per network adapter (VPN / VM adapters hide the LAN).
if-addrs = "0.13"
socket2 = "0.6"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
reqwest.workspace = true
tokio.workspace = true

# Desktop GPUI backends (the phone shells bring their own, see crates/glyph-gpui-android).
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
gpui_platform = { git = "https://github.com/zed-industries/zed", rev = "9f63850f7affbd57772a4f99554d4fd333b50a6f" }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_System_Com",
    "Win32_System_Threading",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Variant",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
    "Win32_UI_Shell_PropertiesSystem",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Graphics_Gdi",
] }

[target.'cfg(windows)'.build-dependencies]
embed-resource = "3"

# Debug builds stay responsive: GPUI and the rest of the dependency tree are
# far too slow unoptimized for a 30 fps background.
[profile.dev]
opt-level = 1
# Full debug info makes the binary ~65 MB and linking slow; line tables are
# enough for backtraces.
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 3
debug = false

# The large GPUI binary spends substantial edit-build time generating debug
# tables. Keep optimized rendering, but omit those tables for normal UI work.
# Opt back in with --config 'profile.dev.package.glyph.debug=1'.
[profile.dev.package.glyph]
debug = false

# Local test builds: release speed for the app, but no LTO, parallel
# codegen and incremental rebuilds, so an edit rebuilds in a fraction of the
# time. `cargo build --profile fast` -> target/fast/glyph.exe. Ship with release.
[profile.fast]
inherits = "release"
# `false` still permits local ThinLTO; `off` fully disables it for iteration.
lto = "off"
codegen-units = 256
incremental = true
strip = false

[profile.fast.package."*"]
codegen-units = 16
incremental = false

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
