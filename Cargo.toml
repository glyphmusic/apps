[workspace]
resolver = "2"
members = ["crates/glyph-protocol", "crates/glyph-core", "crates/glyph-audio", "crates/glyph-app", "crates/glyph-android", "crates/glyph-tauri"]

[workspace.package]
version = "0.13.7"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/glyphmusic/apps"

[workspace.dependencies]
glyph-protocol = { path = "crates/glyph-protocol" }
glyph-core = { path = "crates/glyph-core" }
glyph-audio = { path = "crates/glyph-audio" }
glyph-app = { path = "crates/glyph-app" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
thiserror = "2"
tracing = "0.1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "fs"] }
futures = "0.3"
flume = "0.11"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream", "gzip", "http2"] }

# Debug builds stay responsive: the audio/codec/UI stack is too slow unoptimized.
[profile.dev]
opt-level = 1
# Full debug info makes the binary ~65 MB and linking slow; line tables are
# enough for backtraces.
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 3
debug = false

# Omit debug tables for the desktop app during normal UI/backend iteration.
# Opt back in with --config 'profile.dev.package.glyph-tauri.debug=1'.
[profile.dev.package.glyph-tauri]
debug = false

# Local test builds: release speed for the app, but no LTO, parallel
# codegen and incremental rebuilds, so an edit rebuilds in a fraction of the
# time. `cargo build --profile fast -p glyph-tauri` -> target/fast/glyph.exe. Ship with release.
[profile.fast]
inherits = "release"
# `false` still permits local ThinLTO; `off` fully disables it for iteration.
lto = "off"
codegen-units = 256
incremental = true
strip = false

[profile.fast.package."*"]
codegen-units = 16
incremental = false

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
