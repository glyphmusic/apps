// The Rust side (crates/glyph-android) is built by scripts/build-android.ps1
// into src/main/jniLibs before Gradle packages it.
plugins {
    id "com.android.application"
}

// Version from the workspace Cargo.toml; versionCode must grow with every
// release or Android refuses the in-app update (0.5.0 -> 500, 1.2.3 -> 10203).
def glyphVersion = (rootProject.file("../../Cargo.toml").text =~ /(?m)^version\s*=\s*"([^"]+)"/)[0][1]
def glyphVersionCode = glyphVersion.tokenize("-")[0].tokenize(".").collect { it as int }
        .with { it[0] * 10000 + it[1] * 100 + it[2] }

android {
    namespace "app.glyph"
    compileSdk 36

    defaultConfig {
        applicationId "app.glyph"
        minSdk 26
        targetSdk 36
        versionCode glyphVersionCode
        versionName glyphVersion
    }

    buildTypes {
        release {
            minifyEnabled false
            // Local builds use the debug key; CI re-signs release APKs with the
            // Glyph release key (.github/workflows/android.yml).
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    packaging {
        jniLibs {
            useLegacyPackaging false
        }
    }
}

dependencies {
    // games-activity pulls an older kotlin-stdlib-jdk7/8 next to appcompat's stdlib.
    implementation platform("org.jetbrains.kotlin:kotlin-bom:1.8.22")
    // Must match android-activity's GameActivity glue (0.6.1 -> 4.4.0).
    implementation "androidx.games:games-activity:4.4.0"
    implementation "androidx.appcompat:appcompat:1.7.1"
    implementation "androidx.core:core:1.16.0"
    // MediaSession + media notification for background playback.
    implementation "androidx.media:media:1.7.0"
}
