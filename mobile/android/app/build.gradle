// The Rust side (crates/glyph-android) is built by scripts/build-android.ps1
// into src/main/jniLibs before Gradle packages it.
plugins {
    id "com.android.application"
}

// Version from the workspace Cargo.toml; versionCode must grow with every
// release or Android refuses the in-app update (0.5.0 -> 500, 1.2.3 -> 10203).
def glyphVersion = (rootProject.file("../../Cargo.toml").text =~ /(?m)^version\s*=\s*"([^"]+)"/)[0][1]
def glyphVersionCode = glyphVersion.tokenize("-")[0].tokenize(".").collect { it as int }
        .with { it[0] * 10000 + it[1] * 100 + it[2] }

android {
    namespace = "app.glyph"
    compileSdk = 36

    defaultConfig {
        applicationId = "app.glyph"
        minSdk = 26
        targetSdk = 36
        versionCode = glyphVersionCode
        versionName = glyphVersion
    }

    buildTypes {
        release {
            minifyEnabled = false
            // Local builds use the debug key; CI re-signs release APKs with the
            // Glyph release key (.github/workflows/android.yml).
            signingConfig = signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    packaging {
        jniLibs {
            useLegacyPackaging = false
        }
    }
}

dependencies {
    // Align transitive kotlin-stdlib-jdk7/8 (1.6.21) with kotlin-stdlib:1.8.22 pulled by AndroidX.
    implementation platform("org.jetbrains.kotlin:kotlin-bom:1.8.22")
    implementation "androidx.appcompat:appcompat:1.7.1"
    implementation "androidx.core:core:1.16.0"
    // MediaSession + media notification for background playback.
    implementation "androidx.media:media:1.7.0"
}

// Copy the built Svelte UI (glyph-ui/dist) into assets/ui/ before packaging.
def syncUiAssets = tasks.register("syncUiAssets", Sync) {
    def distDir = rootProject.file("../../glyph-ui/dist")
    doFirst {
        if (!distDir.exists()) {
            throw new GradleException("glyph-ui/dist not found; run 'npm --prefix glyph-ui run build' first")
        }
    }
    from(distDir)
    into(layout.projectDirectory.dir("src/main/assets/ui"))
}
tasks.named("preBuild").configure {
    dependsOn(syncUiAssets)
}
